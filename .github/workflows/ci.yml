name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  csharp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build csharp/Settle/Settle.csproj -warnaserror
      - name: Run and compare with the golden output
        run: |
          dotnet run --project csharp/Settle/Settle.csproj -- spec/payments.csv > out.txt
          diff -u spec/expected.txt out.txt

  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          g++ --version
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -O2 \
              -Icpp/include cpp/src/*.cpp -o settle
      - name: Run and compare with the golden output
        run: |
          ./settle spec/payments.csv > out.txt
          diff -u spec/expected.txt out.txt

  interop:
    name: "C# calling C++ (P/Invoke)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the native library
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -O2 -fPIC -shared \
              -Icpp/include cpp/src/iban.cpp cpp/src/iban_c.cpp -o libsettle_iban.so
          nm -D --defined-only libsettle_iban.so | grep settle_iban_is_valid
      - name: Build the .NET app and put the library beside it
        run: |
          dotnet publish csharp/Settle/Settle.csproj -c Release -o publish
          cp libsettle_iban.so publish/
      - name: Managed and native paths must produce the same report
        run: |
          ./publish/settle spec/payments.csv > managed.txt
          ./publish/settle spec/payments.csv --native > native.txt
          diff -u spec/expected.txt managed.txt
          diff -u spec/expected.txt native.txt

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Check formatting
        run: test -z "$(gofmt -l go/)"
      - name: Vet
        run: cd go && go vet ./...
      - name: Test
        run: cd go && go test ./...
      - name: Run and compare with the golden output
        run: |
          cd go && go build -o ../settle . && cd ..
          ./settle spec/payments.csv > out.txt
          diff -u spec/expected.txt out.txt
